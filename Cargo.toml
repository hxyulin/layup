[workspace]
resolver = "3"
members = ["crates/layup", "crates/layup-cli", "crates/layup-wasm"]
default-members = ["crates/layup", "crates/layup-cli"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hxyulin/layup"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Size-optimized build for packages/layup (`just wasm`).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
