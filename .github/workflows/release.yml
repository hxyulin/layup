name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ''
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: '.exe'
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      BIN_EXT: ${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --locked --release --target "$TARGET" -p layup-cli
      - name: Exercise the release binary
        run: |
          "target/$TARGET/release/layup$BIN_EXT" --version
          "target/$TARGET/release/layup$BIN_EXT" check examples/*.layup docs/diagrams/*.layup README.md --strict
      - run: node tools/package-release.mjs --target "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: out/release/*.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: out/release
      - name: Generate checksums and release notes
        run: |
          (cd out/release && sha256sum ./*.tar.gz > SHA256SUMS)
          node tools/release-notes.mjs > out/release/NOTES.md
      - name: Publish GitHub release
        run: gh release create "$RELEASE_TAG" out/release/*.tar.gz out/release/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file out/release/NOTES.md --latest
