name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      # rust-toolchain.toml selects stable with rustfmt and clippy.
      - run: just check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: just js-test
      # Chromium's system libraries need root; the recipe then finds it installed.
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: examples/vitepress
      - run: just vitepress-test
