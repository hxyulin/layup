<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>layup iframe host demo</title>
<style>
  body{margin:0;padding:24px;font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1f2328;background:#fff;max-width:1100px}
  h1{font-size:20px;margin:0 0 6px}
  p{color:#57606a;margin:0 0 14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  button{border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
  iframe{width:100%;height:520px;border:1px solid #d8dee4;border-radius:8px;display:block}
  #log{font:12px ui-monospace,Menlo,monospace;color:#57606a;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Embedding a layup diagram</h1>
<p>The frame is an embedded render (<code>--html --embed</code>). The buttons post messages to it; it posts back <code>ready</code> and <code>select</code>.</p>
<div class="row">
  <button data-focus="store">Focus store</button>
  <button data-focus="disk">Focus disk</button>
  <button data-focus="app">Focus application</button>
  <button data-act="clear">Clear</button>
  <button data-theme="light">Light</button>
  <button data-theme="dark">Dark</button>
  <button data-theme="auto">Auto</button>
</div>
<iframe id="frame" src="storage-contracts.embed.html?theme=auto" title="Storage contracts"></iframe>
<div id="log"></div>
<script>
  const frame = document.getElementById('frame');
  const log = document.getElementById('log');
  const say = s => { log.textContent = (s + '\n' + log.textContent).split('\n').slice(0, 8).join('\n'); };
  const send = m => frame.contentWindow.postMessage(m, '*');
  addEventListener('message', e => {
    const m = e.data || {};
    if (m.layup === 'ready') say(`ready: diagram is ${m.width}×${m.height}`);
    if (m.layup === 'select') say(m.id ? `selected ${m.id}` : 'selection cleared');
  });
  document.querySelector('.row').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.focus) send({ layup: 'focus', id: b.dataset.focus });
    else if (b.dataset.act === 'clear') send({ layup: 'clear' });
    else if (b.dataset.theme) send({ layup: 'theme', theme: b.dataset.theme });
  });
</script>
</body>
</html>
