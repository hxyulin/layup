[package]
name = "layup-cli"
version = "0.4.0"
description = "Command-line tool for authored diagrams rendered to SVG and interactive HTML"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["diagram", "svg", "architecture", "cli"]
categories = ["command-line-utilities", "visualization"]
publish = ["crates-io"]

[[bin]]
name = "layup"
path = "src/main.rs"

[dependencies]
layup = { version = "0.4.0", path = "../layup" }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true

# Release archives are produced by .github/workflows/release.yml.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
