[package]
name = "layup"
version = "0.2.0"
description = "Layout engine for authored diagrams rendered to SVG and interactive HTML"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["diagram", "svg", "architecture"]
categories = ["visualization"]
publish = ["crates-io"]

[dependencies]
base64 = "0.22"
rustybuzz = "0.20.1"
ttf-parser = "0.25"
unicode-bidi = "0.3.18"
unicode-ident = "1"
unicode-linebreak = "0.1.5"
unicode-script = "0.5"
unicode-segmentation = "1.12"

[lints]
workspace = true
